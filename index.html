<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қатысушылар | Sarapshy | ҚҚДИ</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Участники медиапроекта «Sarapshy»: должности, профессиональные научные направления и направления по этике.">
<meta name="theme-color" content="#33214A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Layout: the Sarapshy programme site's header, hero and footer; a white filter band; a portrait grid on the warm page background. */
/* Tokens copied from the programme site (sarapshy.kipd.kz, assets/css/style.css). Light-only, like the programme site. */
:root{
  --brand-primary:#512A72; --brand-accent:#6B4590; --brand-tint:#EFE8F3; --brand-deep:#33214A;
  --bg:#F6F3EF; --surface:#FFFFFF; --text:#221D26; --muted:#5E5766; --border:#8E8796; --line:#E6E0E4;
  --on-deep:#DCD2E3; --on-deep-dim:#CBBBD6; --white:#FFFFFF; --scrim:rgba(34,29,38,.62);
  --radius:8px; --font:"Mulish",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --focus:0 0 0 3px var(--surface),0 0 0 5px var(--brand-accent);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.55;overflow-wrap:break-word}
img{max-width:100%}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:4px}
[hidden]{display:none!important}
.container{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.site-header{background:var(--brand-deep)}
.header-inner{display:flex;align-items:center;gap:20px;min-height:88px;padding-block:14px}
.brand-mki{display:flex;align-items:center;align-self:stretch;padding-right:20px;border-right:1px solid rgba(255,255,255,.22)}
.brand-logo-mki{display:block;height:clamp(19px,6.2vw,42px);width:auto;max-width:none}
.brand{display:flex;align-items:center;min-width:0}
.brand-logo{display:block;height:clamp(28px,8.6vw,60px);width:auto;max-width:none}
.lang-switch{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.lang-btn{min-width:44px;min-height:44px;padding:0 6px;background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-weight:700;font-size:.875rem;letter-spacing:.02em;color:var(--on-deep-dim);cursor:pointer}
.lang-btn:hover{color:var(--white)}
.lang-btn[aria-pressed="true"]{color:var(--white);border-bottom-color:var(--white)}
.site-header :focus-visible{box-shadow:0 0 0 2px var(--brand-deep),0 0 0 4px var(--white)}
.brand-text{font-weight:800;font-size:1.5rem;letter-spacing:.01em;color:var(--white)}
.brand-sub{font-weight:600;font-size:.875rem;color:var(--on-deep-dim);margin-left:10px}

/* Hero */
.hero{background:var(--bg);padding-block:40px 44px;border-bottom:1px solid var(--line)}
.hero-title{margin:0 0 14px;font-weight:800;line-height:1.1;letter-spacing:-.015em;font-size:clamp(2rem,4.5vw + 1rem,3.5rem);color:var(--text);max-width:860px;text-wrap:balance}
.hero-accent{color:var(--brand-primary);white-space:nowrap}
.hero-support{margin:0 0 24px;font-size:clamp(1.0625rem,1vw + .8rem,1.375rem);max-width:48ch;color:var(--muted)}
.hero-facts{display:flex;flex-wrap:wrap;gap:16px 40px;margin:0}
.fact{display:flex;flex-direction:column;gap:2px;padding:2px 0 2px 14px;border-left:3px solid var(--brand-primary)}
.fact span{font-size:.875rem;color:var(--muted)}
.fact strong{font-size:1.1875rem;color:var(--text);font-variant-numeric:tabular-nums}

/* Filter band */
.hero-about{margin:0 0 28px;max-width:72ch}
.hero-about p{margin:0 0 12px;font-size:1.0625rem;color:var(--text)}
.hero-about p:last-child{margin-bottom:0}
.filters{background:var(--bg);padding-block:40px 24px}
.filters-inner{display:grid;gap:16px}
.section-title{margin:0;font-size:1.5rem;font-weight:800;color:var(--brand-primary)}
.search-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-row input{background:var(--surface);flex:1 1 280px;min-width:0;min-height:48px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.count{font-size:.9375rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips-label{font-size:.875rem;font-weight:700;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9375rem;font-weight:600;line-height:1.25;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:8px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:background-color .15s,border-color .15s}
.chip .n{font-weight:700;font-size:.8125rem;color:var(--muted)}
.chip:hover{border-color:var(--brand-accent)}
.chip[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand-primary);color:var(--brand-primary)}
.chip[aria-pressed="true"] .n{color:var(--brand-primary)}

/* Grid */
.people{padding-block:8px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:20px}
.card{font:inherit;color:inherit;text-align:left;cursor:pointer;display:grid;grid-template-rows:auto 1fr;min-width:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .15s,transform .2s}
.card:hover{border-color:var(--brand-accent);transform:translateY(-2px)}
.ph{aspect-ratio:3/4;max-width:100%;background:var(--line);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.meta{display:grid;gap:8px;align-content:start;padding:14px 16px 18px;min-width:0}
.nm{font-weight:800;font-size:1.0625rem;line-height:1.25;color:var(--text)}
.nm span{display:block;font-weight:600;font-size:.9375rem;color:var(--text)}
.deg{justify-self:start;font-weight:700;font-size:.75rem;letter-spacing:.02em;color:var(--brand-primary);background:var(--brand-tint);border-radius:4px;padding:2px 8px}
.pos{font-size:.875rem;color:var(--muted);line-height:1.45}
.empty{color:var(--muted);padding-block:24px}

/* Profile dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--text);border-radius:var(--radius);width:min(980px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:var(--scrim)}
.sheet{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);position:relative}
.big{background:var(--line)}
.big img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;aspect-ratio:3/4}
.info{padding:32px 32px 24px;display:grid;gap:22px;align-content:start;min-width:0}
.info h2{font-weight:800;font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.block{padding-left:14px;border-left:3px solid var(--brand-primary)}
.lab{font-size:.875rem;font-weight:700;color:var(--brand-primary);margin:0 0 4px}
.info p{margin:0;max-width:65ch}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.9375rem;font-weight:600;background:var(--brand-tint);color:var(--brand-primary);border-radius:var(--radius);padding:6px 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border:1px solid var(--brand-primary);border-radius:var(--radius);font:inherit;font-weight:700;font-size:.9375rem;line-height:1.2;cursor:pointer;background:var(--surface);color:var(--brand-primary);transition:background-color .15s,color .15s}
.btn:hover{background:var(--brand-tint)}
.btn-primary{background:var(--brand-primary);color:var(--white)}
.btn-primary:hover{background:var(--brand-accent);color:var(--white)}
.close{position:absolute;right:12px;top:12px;width:44px;padding:0;font-size:1.5rem;border-color:var(--line)}
.nav{display:flex;gap:8px}

/* Footer */
.site-footer{background:var(--brand-deep);color:var(--on-deep);padding-block:28px 32px;font-size:.9375rem}
.footer-inner p{margin:0 0 8px}
.site-footer a{color:var(--white);font-weight:700;display:inline-flex;align-items:center;min-height:44px}

@media (min-width:768px){.footer-inner{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}.section-title{font-size:1.75rem}}
@media (max-width:720px){
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
  .chip{flex:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .meta{padding:10px 12px 14px}
  .nm{font-size:.9375rem}.nm span{font-size:.875rem}.pos{font-size:.8125rem}
  .sheet{grid-template-columns:1fr}
  .big img{aspect-ratio:4/5;max-height:60vh}
  .info{padding:22px 18px}
  .brand-sub{display:none}
  .header-inner{min-height:64px;gap:8px;padding-block:10px}
  .brand-mki{padding-right:8px}
}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>


<header class="site-header">
  <div class="container header-inner">
    <div class="brand-mki"><img class="brand-logo-mki" id="mkiLogo" src="assets/img/logo-mki.png" alt="Қазақстан Республикасы Мәдениет және ақпарат министрлігі" width="556" height="100"></div>
    <div class="brand"><img class="brand-logo" id="brandLogo" src="assets/img/logo-kk.png" alt="Қазақстан қоғамдық даму институты" width="134" height="56"></div>
    <nav class="lang-switch" aria-label="Тіл / Язык">
      <button type="button" class="lang-btn" data-lang="kk" lang="kk" aria-pressed="true">ҚАЗ</button>
      <button type="button" class="lang-btn" data-lang="ru" lang="ru" aria-pressed="false">РУС</button>
    </nav>
  </div>
</header>

<main>
  <section class="hero" aria-labelledby="hero-title">
    <div class="container">
      <h1 id="hero-title" class="hero-title" data-i18n-html="hero_title"></h1>
      <p class="hero-support" data-i18n="hero_lead"></p>
      <div class="hero-about">
        <p data-i18n-html="intro_p1"></p>
        <p data-i18n-html="intro_p2"></p>
      </div>
      <div class="hero-facts" id="facts"></div>
    </div>
  </section>

  <section class="filters" aria-labelledby="filters-title">
    <div class="container filters-inner">
      <h2 id="filters-title" class="section-title" data-i18n="search_title"></h2>
      <div class="search-row">
        <input id="q" type="search" data-i18n-ph="search_ph">
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <p class="chips-label" id="chips-label" data-i18n="ethics"></p>
      <div class="chips" id="chips" role="group" aria-labelledby="chips-label"></div>
    </div>
  </section>

  <section class="people" data-i18n-aria="people">
    <div class="container">
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden data-i18n="empty"></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p data-i18n="footer_copy"></p>
    <p data-i18n="footer_address"></p>
    <p><a href="https://kipd.kz" rel="noopener" target="_blank">kipd.kz</a></p>
  </div>
</footer>

<dialog id="dlg" aria-labelledby="dlgName">
  <div class="sheet">
    <button class="btn close" id="dlgClose" data-i18n-aria="close">×</button>
    <div class="big"><img id="dlgImg" alt=""></div>
    <div class="info">
      <div style="display:grid;gap:10px;padding-right:44px">
        <h2 id="dlgName"></h2>
        <span class="deg" id="dlgDeg"></span>
      </div>
      <div class="block"><p class="lab" data-i18n="position"></p><p id="dlgPos"></p></div>
      <div class="block"><p class="lab" data-i18n="research"></p><p id="dlgRes"></p></div>
      <div><p class="lab" data-i18n="ethics"></p><div class="tags" id="dlgEth"></div></div>
      <div class="bar">
        <span class="count" id="dlgIdx"></span>
        <div class="nav"><button class="btn" id="prev" data-i18n="prev"></button><button class="btn btn-primary" id="next" data-i18n="next"></button></div>
      </div>
    </div>
  </div>
</dialog>

    intro_p2: 'Проект реализуется при поддержке Министерства культуры и информации Республики Казахстан.',
    fact_people: 'Участников', fact_topics: 'Направлений по этике',
    search_title: 'Поиск участников', search_ph: 'Имя, организация или тема',
    ethics: 'Направление по этике', all: 'Все', people: 'Участники',
    shown_all: n => `Показаны все ${n}`, found: (a, n) => `Найдено: ${a} из ${n}`,
    empty: 'Никто не найден. Измените запрос или выберите «Все».',
    position: 'Должность', research: 'Профессиональное научное направление',
    prev: '← Назад', next: 'Далее →', of: (a, n) => `${a} из ${n}`, close: 'Закрыть',
    footer_copy: '© НАО «Казахстанский институт общественного развития», 2026',
    footer_address: 'г. Астана, пр. Кабанбай батыра, 11/5, БЦ «Нұрлы Орда»',
    logo_src: 'assets/img/logo-ru.png', logo_alt: 'Казахстанский институт общественного развития',
    mki_alt: 'Министерство культуры и информации Республики Казахстан', brand_sub: 'медиапроект'
  }
};
let lang = 'kk';
const T = k => I18N[lang][k];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
let active = null, visible = PEOPLE.slice(), current = -1;

// Per-language fields of a participant. Names are never translated.
const F = p => lang === 'kk'
  ? { position: p.position_kk, research: p.research_kk, degree: p.degree_kk, ethics: p.ethics.map(e => ETH_KK[e] || e) }
  : { position: p.position, research: p.research, degree: p.degree, ethics: p.ethics };
const ethLabel = e => lang === 'kk' ? (ETH_KK[e] || e) : e;

const topics = {};
PEOPLE.forEach(p => p.ethics.forEach(e => topics[e] = (topics[e] || 0) + 1));
const order = Object.keys(topics).sort((a, b) => topics[b] - topics[a] || a.localeCompare(b, 'ru'));

function chip(label, n, val) {
  const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', String(active === val));
  b.append(el('span', null, label), el('span', 'n', n));
  b.onclick = () => { active = active === val ? null : val; render(); };
  return b;
}
function splitName(n) { const i = n.indexOf(' '); return i < 0 ? [n, ''] : [n.slice(0, i), n.slice(i + 1)]; }

function render() {
  $('#chips').replaceChildren(chip(T('all'), PEOPLE.length, null), ...order.map(t => chip(ethLabel(t), topics[t], t)));
  const q = $('#q').value.trim().toLowerCase();
  visible = PEOPLE.filter(p => (!active || p.ethics.includes(active)) &&
    (!q || [p.name, p.position, p.research, p.position_kk, p.research_kk, p.ethics.join(' '), p.ethics.map(e => ETH_KK[e] || '').join(' ')].join(' ').toLowerCase().includes(q)));
  const g = $('#grid'); g.replaceChildren();
  visible.forEach((p, i) => {
    const f = F(p);
    const b = el('button', 'card'); b.type = 'button'; b.setAttribute('aria-label', p.name);
    const ph = el('div', 'ph'); const img = new Image(); img.src = p.thumb; img.alt = ''; img.loading = i < 8 ? 'eager' : 'lazy'; img.decoding = 'async'; ph.append(img);
    const m = el('div', 'meta'); const [sur, rest] = splitName(p.name);
    const nm = el('div', 'nm', sur); nm.append(el('span', null, rest)); m.append(nm);
    if (f.degree) m.append(el('span', 'deg', f.degree));
    m.append(el('div', 'pos', f.position));
    b.append(ph, m); b.onclick = () => openP(p.id); g.append(b);
  });
  $('#empty').hidden = visible.length > 0;
  $('#count').textContent = visible.length === PEOPLE.length ? T('shown_all')(PEOPLE.length) : T('found')(visible.length, PEOPLE.length);
}

function applyLang(l) {
  lang = I18N[l] ? l : 'kk';
  document.documentElement.lang = lang;
  document.title = T('doc_title');
  $$('[data-i18n]').forEach(n => n.textContent = T(n.dataset.i18n));
  $$('[data-i18n-html]').forEach(n => n.innerHTML = T(n.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(n => { n.placeholder = T(n.dataset.i18nPh); n.setAttribute('aria-label', T(n.dataset.i18nPh)); });
  $$('[data-i18n-aria]').forEach(n => n.setAttribute('aria-label', T(n.dataset.i18nAria)));
  $$('.lang-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const logo = $('#brandLogo'); if (logo) { logo.src = T('logo_src'); logo.alt = T('logo_alt'); }
  const mki = $('#mkiLogo'); if (mki) mki.alt = T('mki_alt');
  const sub = $('.brand-sub'); if (sub) sub.textContent = T('brand_sub');
  $('#facts').replaceChildren(...[[T('fact_people'), PEOPLE.length], [T('fact_topics'), order.length]]
    .map(([lab, v]) => { const d = el('p', 'fact'); d.append(el('span', null, lab + ':'), el('strong', null, String(v))); return d; }));
  render();
  if (dlg.open && current >= 0) { const list = visible.length ? visible : PEOPLE; openP(list[current] ? list[current].id : PEOPLE[0].id); }
}

const dlg = $('#dlg');
function openP(id) {
  const p = PEOPLE.find(x => x.id === id); if (!p) return;
  const f = F(p);
  const list = visible.length ? visible : PEOPLE; current = list.findIndex(x => x.id === p.id);
  if (current < 0) current = 0;
  $('#dlgImg').src = p.photo; $('#dlgImg').alt = p.name;
  $('#dlgName').textContent = p.name;
  $('#dlgDeg').textContent = f.degree || ''; $('#dlgDeg').hidden = !f.degree;
  $('#dlgPos').textContent = f.position; $('#dlgRes').textContent = f.research;
  $('#dlgEth').replaceChildren(...f.ethics.map(e => el('span', 'tag', e)));
  $('#dlgIdx').textContent = T('of')(current + 1, list.length);
  if (!dlg.open) dlg.showModal();
  if (location.hash !== '#p-' + id) history.replaceState(null, '', '#p-' + id);
}
function step(d) { const list = visible.length ? visible : PEOPLE; openP(list[(current + d + list.length) % list.length].id); }
$('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
$('#dlgClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { if (location.hash) history.replaceState(null, '', location.pathname + location.search); });
dlg.addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
$('#q').addEventListener('input', render);
$$('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
function fromHash() { const m = location.hash.match(/^#p-(\d{2})$/); if (m) openP(m[1]); else if (dlg.open) dlg.close(); }
window.addEventListener('hashchange', fromHash);
applyLang('kk'); fromHash();

</script>

</body>
</html>
